<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Snell's Law Simulator</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="p-4 md:p-6 text-slate-700">

    <div class="max-w-2xl mx-auto space-y-4">
        <h1 class="text-xl md:text-2xl font-bold text-center text-slate-800 mb-4">สื่อจำลองการหักเหของแสง (Snell's Law)
        </h1>

        <!-- ส่วนควบคุมดัชนีหักเห -->
        <div class="grid grid-cols-2 gap-3">
            <div class="control-card p-3 border-t-4 border-slate-200">
                <label
                    class="font-bold text-slate-600 text-xs block mb-2 text-center uppercase tracking-wider">ตัวกลางที่
                    1
                    (บน)</label>
                <select id="n1select" class="w-full p-2 border rounded-lg mb-2 bg-slate-50 text-xs outline-none">
                    <option value="1.0000">สุญญากาศ</option>
                    <option value="1.0003" selected>อากาศ</option>
                    <option value="1.33">น้ำ</option>
                    <option value="1.49">พลาสติกใส</option>
                    <option value="1.52">แก้วทั่วไป</option>
                    <option value="2.417">เพชร</option>
                    <option value="custom">กำหนดเอง</option>
                </select>
                <div class="flex items-center justify-center gap-1">
                    <button id="n1minus"
                        class="w-7 h-7 flex items-center justify-center bg-slate-100 rounded-full text-slate-600 font-bold text-sm">-</button>
                    <input type="number" id="n1input" step="0.001" value="1.0003"
                        class="index-input w-16 text-center font-bold text-slate-700 py-1 text-sm">
                    <button id="n1plus"
                        class="w-7 h-7 flex items-center justify-center bg-slate-100 rounded-full text-slate-600 font-bold text-sm">+</button>
                </div>
            </div>

            <div class="control-card p-3 border-t-4  border-slate-200">
                <label
                    class="font-bold text-slate-600 text-xs block mb-2 text-center uppercase tracking-wider">ตัวกลางที่
                    2 (ล่าง)</label>
                <select id="n2select" class="w-full p-2 border rounded-lg mb-2 bg-slate-50 text-xs outline-none">
                    <option value="1.0000">สุญญากาศ</option>
                    <option value="1.0003">อากาศ</option>
                    <option value="1.33" selected>น้ำ</option>
                    <option value="1.49">พลาสติกใส</option>
                    <option value="1.52">แก้วทั่วไป</option>
                    <option value="2.417">เพชร</option>
                    <option value="custom">กำหนดเอง</option>
                </select>
                <div class="flex items-center justify-center gap-1">
                    <button id="n2minus"
                        class="w-7 h-7 flex items-center justify-center bg-slate-100 rounded-full text-slate-600 font-bold text-sm">-</button>
                    <input type="number" id="n2input" step="0.001" value="1.33"
                        class="index-input w-16 text-center font-bold text-slate-700 py-1 text-sm">
                    <button id="n2plus"
                        class="w-7 h-7 flex items-center justify-center bg-slate-100 rounded-full text-slate-600 font-bold text-sm">+</button>
                </div>
            </div>
        </div>

        <!-- Simulation View -->
        <div class="control-card p-2 relative">
            <canvas id="mainCanvas" width="600" height="420"></canvas>

            <button id="criticalBtn"
                class="invisible absolute top-4 right-4 bg-amber-500 hover:bg-amber-600 text-xs font-bold px-4 py-2 rounded-full shadow-lg border-2 border-white uppercase transition-all active:scale-95">
                CRITICAL ANGLE
            </button>

            <div
                class="grid grid-cols-2 divide-x divide-slate-100 bg-slate-50/50 rounded-b-xl border-t border-slate-100 mt-2">
                <div class="p-3 text-center">
                    <p id="labelT1" class="text-xs font-bold text-slate-400 uppercase tracking-tight">θ₁ (ตกกระทบ)</p>
                    <div class="flex items-center justify-center gap-0.5">
                        <input type="number" id="angleText" value="30.00" step="0.01"
                            class="text-2xl font-bold w-24 outline-none text-red-500 bg-transparent text-center">
                        <span class="text-xl font-bold text-red-500">°</span>
                    </div>
                </div>
                <div class="p-3 text-center">
                    <p id="labelT2" class="text-xs font-bold text-slate-400 uppercase tracking-tight">θ₂ (หักเห)</p>
                    <div id="resultText" class="text-2xl font-bold">--°</div>
                </div>
            </div>
        </div>

        <!-- Slider UI -->
        <div class="control-card p-5 space-y-4">
            <div class="flex flex-col items-center gap-6">
                <div class="flex flex-col items-center shrink-0 min-w-[140px]">
                    <div id="badgeStatus"
                        class="px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-widest shadow-sm">
                        Refraction
                    </div>
                    <span id="statusLabel" class="text-xs font-bold text-slate-500 mt-2 text-center">
                        การหักเหปกติ
                    </span>
                </div>

                <div class="flex-grow w-full">
                    <input type="range" id="angleSlider" min="0" max="89.99" step="0.01" value="30" class="w-full">
                </div>
            </div>

            <div class="flex items-center justify-center border-t border-slate-100 pt-4">
                <label
                    class="flex items-center gap-3 text-xs font-black text-slate-600 cursor-pointer uppercase tracking-wider">
                    <input type="checkbox" id="showValues" checked class="w-5 h-5 accent-blue-600">
                    แสดงรายละเอียดมุมบนภาพ
                </label>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>

    <div class="max-w-2xl mx-auto space-y-4">
        <div class="review-wrapper">
            <iframe src="https://inskru.com/student-feedback/answers/ET20260223154720874/"></iframe>
        </div>
    </div>

    <footer class="site-footer">
        คุณครูนพรัตน์ แย้มโกสุม<br>
        โรงเรียนปทุมรัตต์พิทยาคม<br>
        by DexChayF
    </footer>
</body>

</html>
